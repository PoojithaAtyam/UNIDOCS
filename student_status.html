<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Status</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom right, #990000, #0033cc);
            margin: 0;
            padding: 30px;
            color: white;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .request-box {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            backdrop-filter: blur(8px);
        }

        .label {
            font-weight: bold;
        }

        .status {
            padding: 3px 8px;
            border-radius: 5px;
        }

        .pending { background: orange; }
        .approved { background: green; }
        .rejected { background: red; }

        .cancel-btn {
            background: red;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            color: white;
            margin-top: 18px;
        }
    </style>
</head>

<body>

<h2>Document Request Status</h2>

<div id="requestList"></div>

<a href="student_dashboard.html">Back to Dashboard</a>

<script>
function loadRequests() {
    let studentID = localStorage.getItem("studentCollegeID");
    let allRequests = JSON.parse(localStorage.getItem("requests")) || [];

    let studentRequests = allRequests.filter(r => r.studentID === studentID);

    let container = document.getElementById("requestList");
    container.innerHTML = "";

    if (studentRequests.length === 0) {
        container.innerHTML = "<p>No requests found.</p>";
        return;
    }

    studentRequests.forEach(req => {
        let div = document.createElement("div");
        div.classList.add("request-box");

        let statusClass =
            req.status === "Pending" ? "pending" :
            req.status === "Approved" ? "approved" : "rejected";

        let allowCancel = false;
        if (req.timestamp) {
            let diffHours = (Date.now() - req.timestamp) / (1000 * 60 * 60);
            if (diffHours <= 12 && req.status === "Pending") {
                allowCancel = true;
            }
        }

        div.innerHTML = `
            <p><span class="label">Document:</span> ${req.document}</p>
            <p><span class="label">Year:</span> ${req.year}</p>
            <p><span class="label">Reason:</span> ${req.reason}</p>
            <p><span class="label">Date:</span> ${req.date}</p>
            <p><span class="label">Status:</span>
                <span class="status ${statusClass}">${req.status}</span>
            </p>
        `;

        if (allowCancel) {
            let btn = document.createElement("button");
            btn.classList.add("cancel-btn");
            btn.innerText = "Cancel Request";
            btn.onclick = () => cancelRequest(req.timestamp);
            div.appendChild(btn);
        }

        container.appendChild(div);
    });
}

function cancelRequest(timestamp) {
    let all = JSON.parse(localStorage.getItem("requests")) || [];

    let updated = all.filter(r => r.timestamp !== timestamp);

    localStorage.setItem("requests", JSON.stringify(updated));

    alert("Request cancelled successfully.");
    loadRequests();
}

loadRequests();
</script>

</body>
</html>

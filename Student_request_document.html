<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Document</title>
    <link rel="stylesheet" href ="style.css" />
    <style>
        

        .container {
            max-width: 450px;
            margin: auto;
            background: rgba(255,255,255,0.15);
            padding: 25px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-top: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ffcc00;
            border: none;
            border-radius: 10px;
            margin-top: 18px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: white;
        }
    </style>
</head>

<body>

<div class="box">

<h2>Request Document</h2>

<select id="documentType">

<option value="">Select Document</option>

<option>Bonafide Certificate</option>

<option>Transcript</option>

<option>Study Certificate</option>

<option>Transfer Certificate</option>

<option>Migration Certificate</option>

</select>

<textarea
id="purpose"
rows="5"
placeholder="Purpose of request"></textarea>

<button onclick="submitRequest()">

Submit Request

</button>

<a href="student_dashboard.html">
    Back to Dashboard
</a>

</div>

<script src="student_request_document.js"></script>

</body>
</html>

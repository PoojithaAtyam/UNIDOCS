<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Document</title>
    <link rel="stylesheet" href ="style.css" />
    <style>
        

        .container {
            max-width: 450px;
            margin: auto;
            background: rgba(255,255,255,0.15);
            padding: 25px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-top: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ffcc00;
            border: none;
            border-radius: 10px;
            margin-top: 18px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Request a Document</h2>

    <label for="document">Select Document</label>
    <select id="document">
        <option value="">-- Select --</option>
        <option>Bonafide Certificate</option>
        <option>Study Certificate</option>
        <option>Fee Receipt</option>
        <option>Transcript</option>
        <option>Others</option>
    </select>

    <label for="year">Which Year?</label>
    <select id="year">
        <option value="">-- Select --</option>
        <option>1st Year</option>
        <option>2nd Year</option>
        <option>3rd Year</option>
        <option>4th Year</option>
        <option>Pass Out</option>
    </select>

    <label for="reason">Reason</label>
    <textarea id="reason" rows="3"></textarea>

    <button onclick="submitRequest()">Submit Request</button>

    <a href="student_dashboard.html">Back to Dashboard</a>
</div>

<script>
function submitRequest() {
    let doc = document.getElementById("document").value;
    let year = document.getElementById("year").value;
    let reason = document.getElementById("reason").value.trim();
    let studentID = localStorage.getItem("studentCollegeID");

    if (!doc || !year || !reason) {
        alert("All fields are required.");
        return;
    }

    let allRequests = JSON.parse(localStorage.getItem("requests")) || [];

    let newRequest = {
        studentID: studentID,
        studentName: localStorage.getItem("studentName"),
        document: doc,
        year: year,
        reason: reason,
        status: "Pending",
        date: new Date().toLocaleDateString(),
        timestamp: Date.now()   // IMPORTANT FIX
    };

    allRequests.push(newRequest);
    localStorage.setItem("requests", JSON.stringify(allRequests));

    alert("Request submitted successfully!");
    window.location.href = "student_status.html";
}
</script>

</body>
</html>

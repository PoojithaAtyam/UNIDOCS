<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Status</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom right, #990000, #0033cc);
            margin: 0;
            padding: 30px;
            color: white;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .request-box {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            backdrop-filter: blur(8px);
        }

        .label {
            font-weight: bold;
        }

        .status {
            padding: 3px 8px;
            border-radius: 5px;
        }

        .pending { background: orange; }
        .approved { background: green; }
        .rejected { background: red; }

        .cancel-btn {
            background: red;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            color: white;
            margin-top: 18px;
        }
    </style>
</head>

<body>

<h2>Document Request Status</h2>

<div id="requestList"></div>

<a href="student_dashboard.html">
    Back to Dashboard
</a>

<script>

async function loadRequests() {

    try {

        const student = JSON.parse(
            localStorage.getItem("student")
        );

        if (!student) {

            document.getElementById("requestList").innerHTML =
                "<h3>Please login again.</h3>";

            return;
        }

        const response = await fetch(
            "http://localhost:5000/api/student/status/" + student.id
        );

        if (!response.ok) {

            throw new Error("Failed to load requests");

        }

        const requests = await response.json();

        const container =
            document.getElementById("requestList");

        container.innerHTML = "";

        if (requests.length === 0) {

            container.innerHTML =
                "<h3>No requests found.</h3>";

            return;
        }

        requests.forEach(req => {

            let statusClass = "pending";

            if (req.status.toLowerCase() === "approved") {

                statusClass = "approved";

            }

            if (req.status.toLowerCase() === "rejected") {

                statusClass = "rejected";

            }

            const requestDate = new Date(req.request_date);
const expectedDate = new Date(req.expected_date);

const formatDate = (date) => {

    const day = String(date.getDate()).padStart(2, "0");
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const year = date.getFullYear();

    return `${day}/${month}/${year}`;
};

            container.innerHTML += `

                <div class="request-box">

                    <p>
                        <span class="label">
                            Request ID:
                        </span>

                        ${req.request_id}
                    </p>

                    <p>
                        <span class="label">
                            Document:
                        </span>

                        ${req.document_type}
                    </p>

                    <p>
                        <span class="label">
                            Purpose:
                        </span>

                        ${req.purpose}
                    </p>

                    <p>
    <span class="label">
        Requested Date:
    </span>

    ${formatDate(requestDate)}
</p>

<p>
    <span class="label">
        Expected Ready Date:
    </span>

    ${formatDate(expectedDate)}
</p>
                    <p>

                        <span class="label">
                            Status:
                        </span>

                        <span class="status ${statusClass}">
                            ${req.status}
                        </span>

                    </p>

                </div>

            `;

        });

    }

    catch (error) {

        console.error(error);

        document.getElementById("requestList").innerHTML =
            "<h3>Unable to load request status.</h3>";

    }

}

loadRequests();

</script>

</body>

</html>

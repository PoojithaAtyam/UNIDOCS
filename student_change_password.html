<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Change Password</title>

<link rel="stylesheet" href="style.css">

<style>

.box{
    width:420px;
    margin:auto;
    margin-top:100px;
    background:rgba(255,255,255,0.12);
    padding:30px;
    border-radius:12px;
    backdrop-filter:blur(10px);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    background:#ffcc00;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="box">

<h2>First Login</h2>

<p>Please create your own password.</p>

<input
type="password"
id="newPassword"
placeholder="New Password">

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password">

<button onclick="changePassword()">
Save Password
</button>

</div>

<script src="student_change_password.js"></script>

</body>

</html>

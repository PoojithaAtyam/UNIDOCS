<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Change Password</title>

<link rel="stylesheet" href="style.css">
<style>
    .container{
            width: 420px;
            background: rgba(255,255,255,0.12);
            padding: 30px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        h2{
            text-align: center;
            margin-bottom: 15px;
            font-size: 26px;
            letter-spacing: 1px;
        }

        label{
            font-size: 15px;
        }

        select, textarea, button{
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 15px;
        }

        select, textarea{
            background: rgba(255,255,255,0.85);
        }

        button{
            background: #ffcc00;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        #error{
            background: rgba(255, 50, 50, 0.7);
            padding: 10px;
            border-radius: 8px;
            display: none;
            margin-bottom: 10px;
        }

        #success{
            background: rgba(50, 255, 50, 0.7);
            padding: 10px;
            border-radius: 8px;
            display: none;
            margin-bottom: 10px;
        }

        a{
            color: white;
            text-decoration: underline;
            font-size: 14px;
        }
</style>
</head>

<body>

<div class="box">

<h2>First Login</h2>

<p>Please create your own password.</p>

<input
type="password"
id="newPassword"
placeholder="New Password">

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password">

<button>

Save Password

</button>

</div>

</body>

</html>
